<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 데이터 비서 — 방한객 분석</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <button id="theme-toggle" class="theme-toggle" type="button" title="다크 모드 전환">🌙</button>
            <h1>📊 AI 데이터 비서</h1>
            <p class="subtitle">한국 방문 외래관광객 데이터 기반 대화형 분석</p>
        </header>

        <nav class="tabs">
            <button class="tab-btn active" data-tab="chat">💬 채팅</button>
            <button class="tab-btn" data-tab="data">📈 데이터 관리</button>
            <button class="tab-btn" data-tab="conversations">💾 대화 기록</button>
        </nav>

        <!-- 채팅 탭 -->
        <section id="chat" class="tab-content active">
            <div class="chat-container">
                <div class="summary-box">
                    <h3>📌 현재 데이터 요약</h3>
                    <div id="summary-content" class="summary-content">
                        <p class="loading">데이터 요약 로딩 중...</p>
                    </div>
                    <div id="statistics-content" class="statistics-content"></div>
                    <canvas id="trend-chart" width="600" height="140" class="trend-chart"></canvas>
                </div>

                <div class="chat-box">
                    <div id="chat-messages" class="messages"></div>
                    <div id="loading-indicator" class="loading-indicator" style="display: none;">
                        <span class="spinner"></span> AI가 응답 중입니다...
                    </div>
                </div>

                <form id="chat-form" class="chat-form">
                    <input
                        type="text"
                        id="chat-input"
                        placeholder="질문을 입력하세요... (예: 최근 트렌드는?) "
                        autocomplete="off"
                    >
                    <button type="submit">전송</button>
                </form>
            </div>
        </section>

        <!-- 데이터 관리 탭 -->
        <section id="data" class="tab-content">
            <div class="data-container">
                <h2>📊 데이터 관리</h2>

                <div class="data-form-box">
                    <h3>새 데이터 추가</h3>
                    <form id="data-form">
                        <div class="form-group">
                            <label for="data-date">날짜 (YYYY-MM)</label>
                            <input type="text" id="data-date" placeholder="2026-09" required>
                        </div>
                        <div class="form-group">
                            <label for="data-value">값 (명)</label>
                            <input type="number" id="data-value" min="0" required>
                        </div>
                        <div class="form-group">
                            <label for="data-memo">메모 (선택)</label>
                            <input type="text" id="data-memo" placeholder="예: 여름 휴가 시즌">
                        </div>
                        <button type="submit" class="btn-primary">추가</button>
                    </form>
                </div>

                <div class="data-list-box">
                    <div class="data-list-header">
                        <h3>데이터 목록</h3>
                        <div class="export-buttons">
                            <button id="export-csv" type="button" class="btn-sm btn-export">CSV 내보내기</button>
                            <button id="export-json" type="button" class="btn-sm btn-export">JSON 내보내기</button>
                        </div>
                    </div>
                    <div id="data-list" class="data-list">
                        <p class="loading">데이터 로딩 중...</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- 대화 기록 탭 -->
        <section id="conversations" class="tab-content">
            <div class="conversations-container">
                <h2>💾 대화 기록</h2>

                <div class="conversations-list-box">
                    <h3>저장된 대화</h3>
                    <div id="conversations-list" class="conversations-list">
                        <p class="loading">대화 기록 로딩 중...</p>
                    </div>
                </div>

                <div class="conversation-detail-box">
                    <h3 id="conversation-title">대화 선택</h3>
                    <div id="conversation-messages" class="conversation-messages">
                        <p class="empty-state">대화를 선택하세요</p>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
